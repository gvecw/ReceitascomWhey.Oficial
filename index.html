    <!-- UTMify Eventos de Conversão - Event Delegation -->
    <script>
      // ─── 1. CAPTURA DE UTMs ───────────────────────────────────────────
      var _utmKeys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src','sck','xcod'];

      function getStoredUtms() {
        var result = {};
        // 1a. Pega da URL atual
        try {
          var params = new URLSearchParams(window.location.search);
          _utmKeys.forEach(function(k) {
            var v = params.get(k);
            if (v) result[k] = v;
          });
        } catch(e) {}
        // 1b. Pega do localStorage (UTMify salva aqui)
        try {
          _utmKeys.forEach(function(k) {
            if (!result[k]) {
              var v = localStorage.getItem(k) || localStorage.getItem('utmify_' + k);
              if (v) result[k] = v;
            }
          });
          // Tenta também o objeto utmify salvo
          var raw = localStorage.getItem('utmify');
          if (raw) {
            var parsed = JSON.parse(raw);
            Object.keys(parsed).forEach(function(k) { if (!result[k] && parsed[k]) result[k] = parsed[k]; });
          }
        } catch(e) {}
        return result;
      }

      function appendUtmsToUrl(url) {
        var utms = getStoredUtms();
        var keys = Object.keys(utms);
        if (!keys.length) return url;
        var sep = url.indexOf('?') >= 0 ? '&' : '?';
        return url + sep + keys.map(function(k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(utms[k]);
        }).join('&');
      }

      // Salva UTMs da URL atual no localStorage ao carregar
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          _utmKeys.forEach(function(k) {
            var v = params.get(k);
            if (v) localStorage.setItem(k, v);
          });
        } catch(e) {}
      })();

      // ─── 2. CHECKOUT DOMAINS ─────────────────────────────────────────
      var _checkoutDomains = ['tilimcheckout.com', 'pay.cakto.com.br'];

      function isCheckoutUrl(url) {
        return _checkoutDomains.some(function(d) { return url && url.indexOf(d) >= 0; });
      }

      // ─── 3. INTERCEPTA window.location.href ─────────────────────────
      // Garante que redirecionamentos JS também levam UTMs
      var _origDescriptor = Object.getOwnPropertyDescriptor(window.location, 'href');
      try {
        var _locationProxy = {
          set href(url) {
            if (isCheckoutUrl(url)) {
              url = appendUtmsToUrl(url);
              console.log('[UTM] Redirect interceptado:', url);
            }
            window.location.assign(url);
          }
        };
      } catch(e) {}

      // Fallback: sobrescreve via patch no assign
      var _origAssign = window.location.assign.bind(window.location);
      window._utmRedirect = function(url) {
        if (isCheckoutUrl(url)) url = appendUtmsToUrl(url);
        _origAssign(url);
      };

      // ─── 4. ADICIONA UTMs AOS LINKS <a> DINAMICAMENTE ───────────────
      function patchCheckoutLinks() {
        document.querySelectorAll('a').forEach(function(link) {
          if (!link._utmPatched && isCheckoutUrl(link.getAttribute('href') || '')) {
            link._utmPatched = true;
            var base = link.getAttribute('href');
            link.setAttribute('href', appendUtmsToUrl(base));
          }
        });
      }

      // Observa o DOM para links adicionados pelo React
      var _observer = new MutationObserver(function() { patchCheckoutLinks(); });
      _observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', function() {
        patchCheckoutLinks();
        // Re-aplica após React montar
        setTimeout(patchCheckoutLinks, 500);
        setTimeout(patchCheckoutLinks, 1500);
      });

      // ─── 5. IDs DOS BOTÕES + EVENTOS UTMIFY ─────────────────────────
      var _checkoutButtons = [
        { id: 'ea5d1993-36bc-9623-3f71-a921eff0da3d', value: 18.90, plan: 'Basico'   },
        { id: 'e9249012-f35b-9564-a38c-d016d183257f', value: 29.90, plan: 'Completo' },
        { id: '99022520-bcaa-4745-7d6e-adb564827c60', value: 24.90, plan: 'Upsell'   },
        { id: '0cf7fa1a-346b-fe19-6c20-8acf07586f0c', value: 24.90, plan: 'Popup'    },
        { id: '09d4ceb2-5d8e-da2b-b15c-488d615edc55', value: 18.90, plan: 'Extra'    }
      ];

      function fireUtmifyEvent(eventName, data) {
        try {
          if (window.utmify && typeof window.utmify === 'function') {
            window.utmify('track', eventName, data || {});
            console.log('[UTMify] Evento:', eventName, data);
          } else {
            window._utmifyQueue = window._utmifyQueue || [];
            window._utmifyQueue.push({ event: eventName, data: data || {} });
          }
        } catch(e) {}
      }

      function drainQueue() {
        if (window._utmifyQueue && window._utmifyQueue.length && window.utmify) {
          window._utmifyQueue.forEach(function(i) { window.utmify('track', i.event, i.data); });
          window._utmifyQueue = [];
        }
      }
      setTimeout(drainQueue, 2000);
      setTimeout(drainQueue, 4000);

      // Event delegation para disparar InitiateCheckout
      document.addEventListener('click', function(e) {
        var el = e.target;
        for (var i = 0; i < 5; i++) {
          if (!el || el === document) break;
          for (var j = 0; j < _checkoutButtons.length; j++) {
            if (el.id === _checkoutButtons[j].id) {
              fireUtmifyEvent('InitiateCheckout', { value: _checkoutButtons[j].value, currency: 'BRL', plan: _checkoutButtons[j].plan });
              try { fbq('track', 'InitiateCheckout', { value: _checkoutButtons[j].value, currency: 'BRL' }); } catch(e) {}
              return;
            }
          }
          if (el.tagName === 'A' && el.href && isCheckoutUrl(el.href)) {
            var val = el.href.indexOf('443d06f83d55c3bd') >= 0 ? 29.90 : (el.href.indexOf('f92ca87a') >= 0 ? 24.90 : 18.90);
            fireUtmifyEvent('InitiateCheckout', { value: val, currency: 'BRL' });
            try { fbq('track', 'InitiateCheckout', { value: val, currency: 'BRL' }); } catch(e) {}
            return;
          }
          el = el.parentElement;
        }
      }, true);
    </script>
