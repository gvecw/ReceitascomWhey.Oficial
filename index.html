    <!-- UTMify UTMs (passa parâmetros para o checkout, não dispara eventos de pixel) -->
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>

    <!-- Eventos e UTM passthrough -->
    <script>
      // ── UTMs ──────────────────────────────────────────────────────
      var _utmKeys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src','sck'];

      (function saveUtms() {
        try {
          var p = new URLSearchParams(window.location.search);
          _utmKeys.forEach(function(k){ var v=p.get(k); if(v) localStorage.setItem(k,v); });
        } catch(e){}
      })();

      function getUtms() {
        var r={};
        try {
          var p = new URLSearchParams(window.location.search);
          _utmKeys.forEach(function(k){
            var v = p.get(k) || localStorage.getItem(k);
            if(v) r[k]=v;
          });
        } catch(e){}
        return r;
      }

      function appendUtms(url) {
        var u=getUtms(), keys=Object.keys(u);
        if(!keys.length) return url;
        var sep = url.indexOf('?')>=0 ? '&' : '?';
        return url+sep+keys.map(function(k){ return k+'='+encodeURIComponent(u[k]); }).join('&');
      }

      // ── Domínios de checkout ───────────────────────────────────────
      var _ckDomains = ['tilimcheckout.com','pay.cakto.com.br'];
      function isCheckout(url){ return url && _ckDomains.some(function(d){ return url.indexOf(d)>=0; }); }
      function checkoutValue(url){
        if(url.indexOf('443d06f83d55c3bd')>=0) return 29.90;
        if(url.indexOf('f92ca87a')>=0)         return 24.90;
        return 18.90;
      }

      // ── Anexa UTMs e listener nos links de checkout ───────────────
      var _patched=[];
      function patchLinks(){
        document.querySelectorAll('a[href]').forEach(function(a){
          var href=a.getAttribute('href')||'';
          if(!isCheckout(href)||_patched.indexOf(a)>=0) return;
          _patched.push(a);
          a.setAttribute('href', appendUtms(href));
          a.addEventListener('click', function(){
            var val=checkoutValue(this.href);
            try{ fbq('track','InitiateCheckout',{value:val,currency:'BRL'}); }catch(e){}
          });
        });
      }

      window.addEventListener('load', function(){
        patchLinks();
        setTimeout(patchLinks, 800);
        setTimeout(patchLinks, 2000);
      });

      // ── ViewContent — apenas no primeiro scroll ───────────────────
      window.addEventListener('scroll', function onScroll(){
        window.removeEventListener('scroll', onScroll);
        try{
          fbq('track','ViewContent',{
            content_name:'400 Preparos Saudáveis com Whey',
            content_type:'product',
            content_ids:['whey-receitas-400'],
            value:18.90,
            currency:'BRL'
          });
        }catch(e){}
      }, {passive:true, once:true});
    </script>
