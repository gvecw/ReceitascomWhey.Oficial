<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>400 Preparos Saudáveis com Whey | A Coletânea Definitiva</title>
    <meta name="description" content="Descubra como preparar refeições incríveis com whey. 400 preparos validados por especialista — tortas, pizzas, sobremesas e muito mais. Mais de 15.000 pessoas já aprovaram." />

    <!-- UTMify Pixel -->
    <script>
      window.pixelId = "69eb710b5d8aab08ae45fef7";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
    </script>

    <!-- UTMify UTMs -->
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>

    <!-- UTMify Eventos de Conversão -->
    <script>
      function fireUtmifyEvent(eventName, data) {
        if (window.utmify && typeof window.utmify === 'function') {
          window.utmify('track', eventName, data || {});
        } else {
          // Fila para disparar quando o pixel carregar
          window._utmifyQueue = window._utmifyQueue || [];
          window._utmifyQueue.push({ event: eventName, data: data || {} });
        }
      }

      // Dispara eventos na fila assim que o pixel estiver pronto
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window._utmifyQueue && window.utmify) {
            window._utmifyQueue.forEach(function (item) {
              window.utmify('track', item.event, item.data);
            });
            window._utmifyQueue = [];
          }
        }, 1500);

        // IDs dos botões de checkout mapeados no bundle
        var basicBtnId    = 'ea5d1993-36bc-9623-3f71-a921eff0da3d'; // plano R$18,90
        var completeBtnId = 'e9249012-f35b-9564-a38c-d016d183257f'; // plano R$29,90
        var upsellBtnId   = '99022520-bcaa-4745-7d6e-adb564827c60'; // pop-up upsell R$24,90
        var popupBtnId    = '0cf7fa1a-346b-fe19-6c20-8acf07586f0c'; // outro botão popup
        var extraBtnId    = '09d4ceb2-5d8e-da2b-b15c-488d615edc55'; // botão extra

        var checkoutButtons = [
          { id: basicBtnId,    value: 18.90, plan: 'Basico'   },
          { id: completeBtnId, value: 29.90, plan: 'Completo' },
          { id: upsellBtnId,   value: 24.90, plan: 'Upsell'   },
          { id: popupBtnId,    value: 24.90, plan: 'Popup'    },
          { id: extraBtnId,    value: 18.90, plan: 'Extra'    }
        ];

        checkoutButtons.forEach(function (btn) {
          var el = document.getElementById(btn.id);
          if (el) {
            el.addEventListener('click', function () {
              fireUtmifyEvent('InitiateCheckout', {
                value: btn.value,
                currency: 'BRL',
                plan: btn.plan
              });
            });
          }
        });

        // Fallback: qualquer link de checkout dispara InitiateCheckout
        document.querySelectorAll('a[href*="pay.cakto.com.br"], a[href*="tilimcheckout.com"]').forEach(function (link) {
          link.addEventListener('click', function () {
            var value = link.href.indexOf('443d06f83d55c3bd') >= 0 ? 29.90 : 18.90;
            fireUtmifyEvent('InitiateCheckout', { value: value, currency: 'BRL' });
          });
        });
      });
    </script>

    <script type="module" crossorigin src="./assets/index-f7H5nnjm.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
