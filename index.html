      // Garante que ViewContent dispara apenas UMA vez, bloqueando duplicatas de qualquer fonte
      var _vcDone = false;
      var _realFbq = window.fbq;
      function _safeFbq() {
        if (arguments[0] === 'track' && arguments[1] === 'ViewContent') {
          if (_vcDone) return;
          _vcDone = true;
        }
        return _realFbq.apply(this, arguments);
      }
      _safeFbq.callMethod = _realFbq.callMethod;
      _safeFbq.queue     = _realFbq.queue;
      _safeFbq.push      = _realFbq.push;

    <script

    <!-- Rastreamento de Checkout -->
    <script>
      // URLs de checkout
      var _checkoutUrls = [
        'tilimcheckout.com',
        'pay.cakto.com.br'
      ];

      function isCheckoutUrl(url) {
        return url && _checkoutUrls.some(function(d) { return url.indexOf(d) >= 0; });
      }

      function getCheckoutValue(url) {
        if (url.indexOf('443d06f83d55c3bd') >= 0) return 29.90;
        if (url.indexOf('f92ca87a')         >= 0) return 24.90;
        return 18.90;
      }

      // Captura e salva UTMs da URL no localStorage
      (function() {
        try {
          var keys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src','sck','xcod'];
          var p = new URLSearchParams(window.location.search);
          keys.forEach(function(k) { var v = p.get(k); if (v) localStorage.setItem(k, v); });
        } catch(e) {}
      })();

      function getStoredUtms() {
        var result = {};
        try {
          var keys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src','sck','xcod'];
          var p = new URLSearchParams(window.location.search);
          keys.forEach(function(k) {
            var v = p.get(k) || localStorage.getItem(k);
            if (v) result[k] = v;
          });
        } catch(e) {}
        return result;
      }

      function appendUtms(url) {
        var utms = getStoredUtms();
        var keys = Object.keys(utms);
        if (!keys.length) return url;
        var sep = url.indexOf('?') >= 0 ? '&' : '?';
        return url + sep + keys.map(function(k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(utms[k]);
        }).join('&');
      }

      function fireCheckoutEvent(value) {
        // Facebook Pixel
        try { fbq('track', 'InitiateCheckout', { value: value, currency: 'BRL' }); } catch(e) {}
        // UTMify
        try {
          if (window.utmify) window.utmify('track', 'InitiateCheckout', { value: value, currency: 'BRL' });
        } catch(e) {}
      }

      // Anexa listener DIRETAMENTE nos links de checkout após React montar
      var _patched = [];
      function attachToCheckoutLinks() {
        document.querySelectorAll('a[href]').forEach(function(link) {
          var href = link.getAttribute('href') || '';
          if (!isCheckoutUrl(href)) return;
          if (_patched.indexOf(link) >= 0) return; // já processado

          _patched.push(link);

          // Adiciona UTMs ao href
          link.setAttribute('href', appendUtms(href));

          // Listener direto — só esse link dispara o evento
          link.addEventListener('click', function() {
            fireCheckoutEvent(getCheckoutValue(this.href));
          });
        });
      }

      // Aguarda React renderizar e então anexa os listeners
      window.addEventListener('load', function() {
        attachToCheckoutLinks();
        setTimeout(attachToCheckoutLinks, 800);
        setTimeout(attachToCheckoutLinks, 2000);
      });

      // ViewContent — dispara no primeiro scroll (deduplicado pelo wrapper acima)
      window.addEventListener('scroll', function() {
        try {
          fbq('track', 'ViewContent', {
            content_name: '400 Preparos Saud\u00e1veis com Whey',
            content_type: 'product',
            content_ids: ['whey-receitas-400'],
            value: 18.90,
            currency: 'BRL'
          });
        } catch(e) {}
      }, { passive: true, once: true });

    </script>
